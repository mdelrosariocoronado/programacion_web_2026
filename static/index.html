<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RED DE EMPRENDIMIENTOS - TANDIL </title>

    <link rel="icon" type="image/png" href="./images/mapa.png">
    <link rel="stylesheet" type="text/css" href="./style.css" />
</head>

<body>
    <header>
        <div class="main-header">
            <div >
                <img class="icono" src="./images/mapa.png" alt="Logo de la red de emprendimientos">
            </div>
            <div class="titulo">
                <h1> RED DE EMPRENDIMIENTOS - TANDIL</h1>
            </div>
        </div>
        <div >
            <nav class="main-nav">
                <ul class="main-ul">
                    <button class="tab-btn active" data-entity="emprendimientos">Emprendimientos</button>
                    <button class="tab-btn" data-entity="usuarios">Usuarios</button>
                    <button class="tab-btn" data-entity="publicaciones">Publicaciones</button>
                    <button class="tab-btn" data-entity="suscripciones">Suscripciones</button>
                </ul>
            </nav>
        </div>
    </header>

    <main class="portal-layout">
        <section class="portal-card form-section">
            <h2> Registrar Emprendimiento</h2>
            <form id=""form-emprendimiento" >
                <div class="form-group">
                    <label for="nombre">Nombre (*): </label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Velas tadil">
                </div>
                <div class="form-group">
                    <label for="Rubro">Rubro:</label>
                    <input type="text" id="Rubro" name="Rubro" required>
                </div>
                <div class="form-group">
                    <label for="descripcion">Descripción:</label>
                    <textarea id="descripcion" name="descripcion" required></textarea>
                </div>

                <div class="form-group">
                    <label for="categoria">Categoría:</label>
                    <input type="text" id="categoria" name="categoria" required>
                </div>  

                <div class="form-group">
                    <label for="ubicacion">Ubicación:</label>
                    <input type="text" id="ubicacion" name="ubicacion" required>
                </div>
                <div class="form-group">
                    <label for="url">URL paginas????/</label>
                    <input type="text" id="url" name="url" required placeholder="https://instagram/../..com">
                </div>
                <div class="form-group">
                    <label for="contacto">Contacto: </label>
                    <input type="text" id="contacto" name="contacto" required placeholder="(0249) 154-123456">

                </div>
                <div class="eliminar-container"
                    <button class="btn-eliminar-emp" type="submit">Registrar Emprendimiento</button>
                </div>
            </form>
        </section> 
        
        <section class="portal-card list-section">
            <h2>Lista de Emprendimientos</h2>
            <div id="emprendimientos-list" class="emprendimientos-list">
                
            </div>

        </section>
    </main>

    <script src="/static/app.js"></script>

</body>
</html>
